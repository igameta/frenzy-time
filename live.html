<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FRENZY.NETの文化祭DJイベント配信。フロアを切り替えてTwitchの配信とコメントを視聴できます。">
  <meta name="color-scheme" content="light dark">
  <title>配信 | FRENZY.NET</title>
  <link rel="icon" href="./assets/frenzy-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body data-page="live">
  <a class="skip-link" href="#main">本文へ移動</a>
  <div class="site">
    <header class="header">
      <div class="brand-watermark" aria-hidden="true"></div>
      <p class="event-name" id="event-name">文化祭 DJイベント</p>
      <h1>LIVESTREAM</h1>
    </header>
    <main id="main" tabindex="-1">
      <div id="demo-banner"></div>
      <p class="data-status" id="data-status" role="status">出演予定を読み込んでいます。</p>
      <div class="pickers" id="live-floors" aria-label="配信フロア"></div>
      <section class="stream-grid" aria-label="配信とコメント">
        <div class="video-area" id="video-area"><p>配信の準備中です。</p></div>
        <aside class="chat-area" id="chat-area" aria-label="Twitchコメント"><p>コメントの準備中です。</p></aside>
      </section>
      <section id="live-lineup" aria-label="出演予定"></section>
      <a class="text-link" id="back-to-schedule" href="./index.html">タイムテーブルへ戻る →</a>
      <noscript><p>配信を表示するにはJavaScriptを有効にしてください。</p></noscript>
    </main>
    <footer class="footer">
      <div class="organizer"><span>ORGANIZED BY</span><span class="brand-logo" role="img" aria-label="FRENZY.NET"></span></div>
      <p>出演時刻は予定です。進行により前後します。<br>時刻はすべて日本時間（JST）です。</p>
    </footer>
  </div>
  <dialog id="dj-dialog" aria-labelledby="profile-name"><div class="profile-panel" id="profile-panel"></div></dialog>
</body>
</html>
